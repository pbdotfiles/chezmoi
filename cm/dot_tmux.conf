# Configuration file recommended by Gemini

# Fix Neovim escape lag
set -sg escape-time 0

# Enable mouse support
set -g mouse on

# Fix colors for Kitty + Neovim
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Open new windows/panes in the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Optional: Set the status bar to be more minimal
# set -g status-style bg=default  

# Allow tmux to pass clipboard data to the terminal
set -s set-clipboard on

# Allow programs inside tmux to send escape sequences (like OSC 52) directly
# to the outer terminal. Required for clipboard forwarding through nested tmux
# (e.g. SSH into a remote machine that also runs tmux).
set -g allow-passthrough on

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# Reload tmux config
bind r source-file ~/.tmux.conf \; display "Tmux Config Reloaded!"

# Update the $DISPLAY variable when re-attaching
set-option -g update-environment "DISPLAY"

set -ga terminal-overrides ",xterm-256color:Tc"
set -q -g utf8 on
set -wq -g utf8 on

# Ensure window number remain consectuive
set-option -g renumber-windows on

# Move window left/right with Prefix + < or >
bind-key -r "<" swap-window -t -1\; select-window -t -1
bind-key -r ">" swap-window -t +1\; select-window -t +1

# OpenCode session status, written by ~/.config/opencode/plugins/tmux-status
#   pane option   @oc_state: blocked | working | idle
#   window option @oc_done:  1 when a run finished while nobody was viewing the window
# The whole window entry is colored, with a symbol in front. Most urgent pane wins:
#   red " ! ": blocked, black with green " ✓ ": done and unseen,
#   yellow " … ": working, unchanged when idle.
# Background colors keep the entries visible on the green status bar.
set -g focus-events on
set -g @oc_level '#{?#{m:*blocked*,#{P:#{@oc_state} }},blocked,#{?#{@oc_done},done,#{?#{m:*working*,#{P:#{@oc_state} }},working,}}}'
set -g @oc_start '#{?#{==:#{E:@oc_level},blocked},#[bg=red fg=black bold] ! ,#{?#{==:#{E:@oc_level},done},#[bg=black fg=green bold] ✓ ,#{?#{==:#{E:@oc_level},working},#[bg=yellow fg=black] … ,}}}'
set -g @oc_end '#{?#{E:@oc_level},#[default],}'
set -g window-status-format '#{E:@oc_start}#I:#W#{?window_flags,#{window_flags}, }#{E:@oc_end}'
set -g window-status-current-format '#{E:@oc_start}#I:#W#{?window_flags,#{window_flags}, }#{E:@oc_end}'

# Visiting a window marks its finished runs as seen
set-hook -g pane-focus-in[10] 'set -w -u @oc_done'
set-hook -g session-window-changed[10] 'set -w -u @oc_done'
set-hook -g client-session-changed[10] 'set -w -u @oc_done'
